name: unibrain
channels:
  - conda-forge
dependencies:
  # Python 3.9 is pinned for reproducibility and satisfies the documented >=3.9 requirement.
  - python=3.9
  - pip=24.2

  # Core single-cell analysis stack used directly by the scripts.
  - scanpy=1.9.4
  - anndata=0.9.2
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.8.1
  - scikit-learn=1.1.1
  - statsmodels=0.13.2
  - h5py=3.6.0
  - numba=0.58.1
  - umap-learn=0.5.6

  # Plotting, clustering, file I/O, and notebooks used by this repository.
  - matplotlib=3.7.2
  - seaborn=0.13.2
  - openpyxl=3.1.5
  - joblib=1.4.2
  - tqdm=4.67.1
  - ipykernel=6.29.5
  - jupyterlab=4.3.8

  # Packages installed from PyPI in the tested Scanpy workflow.
  - pip:
      - harmonypy==0.0.10
      - scanorama==1.7.4
      - scib==1.1.5
      - scrublet==0.2.3
      - drug2cell==0.1.2
      - igraph==0.11.8
      - leidenalg==0.10.2
      - rapidfuzz==3.9.7
      - treelib==1.7.1
